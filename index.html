<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vexus ERP</title>
<style>
/* Layout: ERP shell com sidebar fixa de módulos + área de trabalho com topbar e sub-abas por função.
   Identidade dark metálica derivada do logo (preto + azul). Tema único (dark), por escolha de marca. */
:root{
  --bg:#0a0e1a; --surface:#111726; --surface-2:#161d30; --surface-3:#1d2842;
  --border:#263251; --border-soft:#1b2338;
  --fg:#e9eef8; --muted:#94a1bd; --faint:#6b7793;
  --accent:#3d82e6; --accent-2:#5ba3f0; --accent-deep:#2456b8;
  --glow:rgba(61,130,230,.30);
  --good:#32c892; --good-bg:rgba(50,200,146,.12);
  --warn:#e6b24c; --warn-bg:rgba(230,178,76,.12);
  --crit:#e85d4e; --crit-bg:rgba(232,93,78,.13);
  --grad:linear-gradient(135deg,#5ba3f0,#2456b8);
  --radius:12px;
  color-scheme:dark;
  --ff-body:'Manrope',system-ui,-apple-system,sans-serif;
  --ff-head:'Sora',var(--ff-body);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-body);line-height:1.5;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(37,86,184,.14),transparent 60%),
                   radial-gradient(900px 500px at -10% 110%,rgba(61,130,230,.10),transparent 55%);
  background-attachment:fixed;}
h1,h2,h3,h4{font-family:var(--ff-head);margin:0;text-wrap:balance;font-weight:600}
a{color:inherit}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Splash / login ---------- */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:radial-gradient(900px 600px at 50% 30%,#0e1526,#05070e);transition:opacity .5s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-box{display:flex;flex-direction:column;align-items:center;gap:26px;padding:30px;text-align:center}
.splash-box img{width:min(210px,56vw);filter:drop-shadow(0 10px 40px var(--glow))}
.splash-sub{color:var(--muted);max-width:360px;font-size:14px;margin-top:-6px}
.enter-btn{border:none;cursor:pointer;background:var(--grad);color:#fff;font-weight:700;
  padding:13px 40px;border-radius:999px;font-size:15px;letter-spacing:.3px;
  box-shadow:0 8px 30px var(--glow);transition:transform .15s,box-shadow .15s}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 12px 38px var(--glow)}
.splash-tag{font-size:12px;color:var(--faint);letter-spacing:2px;text-transform:uppercase}

/* ---------- App shell ---------- */
#app{display:none;min-height:100%}
#app.on{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0b101d,#0c1220);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
.brand img{height:34px;filter:drop-shadow(0 4px 14px var(--glow))}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:var(--ff-head);font-weight:700;letter-spacing:1.5px;font-size:16px}
.brand .wm span{font-size:10px;letter-spacing:3px;color:var(--accent-2);font-weight:600;margin-top:3px}
.nav{padding:8px 10px;overflow-y:auto;flex:1}
.nav-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
  padding:14px 12px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--muted);
  padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;text-align:left;
  transition:background .12s,color .12s}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.active{background:linear-gradient(90deg,rgba(61,130,230,.22),rgba(61,130,230,.05));
  color:#fff;box-shadow:inset 2px 0 0 var(--accent-2)}
.side-foot{padding:14px 16px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff;flex:none}
.side-foot .who{font-size:12.5px;line-height:1.25}
.side-foot .who b{font-weight:700}.side-foot .who span{color:var(--faint);font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:14px 26px;background:rgba(10,14,26,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-soft)}
.topbar .burger{display:none;background:none;border:none;color:var(--fg);cursor:pointer}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb .mod{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent-2);font-weight:700}
.crumb h1{font-size:19px}
.topbar .spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:8px 14px;min-width:200px;color:var(--muted)}
.search input{background:none;border:none;color:var(--fg);outline:none;font-size:13px;width:100%}
.search svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:1.8;flex:none}
.bell{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:50%;
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.bell svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.bell .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;
  background:var(--crit);box-shadow:0 0 0 2px var(--surface)}

.content{padding:24px 26px 60px;max-width:1360px;width:100%}
.view{display:none}.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* sub-abas de função */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--border-soft);
  padding-bottom:0}
.tabs button{background:none;border:none;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;
  padding:9px 14px;border-radius:8px 8px 0 0;position:relative;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.active{color:#fff}
.tabs button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;
  background:var(--grad);border-radius:2px}
.pane{display:none}.pane.on{display:block;animation:fade .25s ease}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-6{grid-template-columns:repeat(6,1fr)}
.span-2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:14px;margin-bottom:3px}
.card .sub{color:var(--faint);font-size:12px;margin-bottom:14px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{margin:0}
.sec-title{font-family:var(--ff-head);font-size:15px;font-weight:600;margin:4px 0 14px;
  display:flex;align-items:center;gap:9px}
.sec-title .accentbar{width:4px;height:17px;border-radius:2px;background:var(--grad)}

.tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;
  position:relative;overflow:hidden}
.tile .t-ico{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;background:var(--surface-2);color:var(--accent-2)}
.tile .t-ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.tile .t-lbl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2px;padding-right:42px;min-height:16px}
.tile .t-val{font-family:var(--ff-head);font-size:24px;font-weight:700;margin-top:7px;letter-spacing:-.5px;white-space:nowrap}
.cols-6 .tile .t-val{font-size:21px}
.tile .t-delta{font-size:11.5px;margin-top:5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--good)}.down{color:var(--crit)}

table{width:100%;border-collapse:collapse;font-size:13px}
.tbl-wrap{overflow-x:auto}
th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);
  font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{font-weight:700;color:#fff}
tfoot td{font-weight:700;color:#fff;border-top:1px solid var(--border);padding:12px 14px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;
  border-radius:999px;letter-spacing:.2px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-good{color:var(--good);background:var(--good-bg)}
.b-warn{color:var(--warn);background:var(--warn-bg)}
.b-crit{color:var(--crit);background:var(--crit-bg)}
.b-info{color:var(--accent-2);background:rgba(61,130,230,.13)}
.b-mute{color:var(--muted);background:var(--surface-3)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;
  background:var(--surface-3);color:var(--muted)}
.chip.mei{color:#7ad0b0;background:rgba(50,200,146,.12)}
.chip.sn{color:#5ba3f0;background:rgba(61,130,230,.14)}
.chip.lp{color:#e0b968;background:rgba(230,178,76,.12)}

.progress{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:999px;background:var(--grad)}
.progress.warn>i{background:linear-gradient(90deg,#e6b24c,#d08a2e)}
.progress.crit>i{background:linear-gradient(90deg,#e85d4e,#c23b2d)}
.progress.good>i{background:linear-gradient(90deg,#32c892,#1f9e6f)}

.btn{border:none;cursor:pointer;background:var(--grad);color:#fff;font-weight:700;font-size:13px;
  padding:9px 16px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 4px 16px var(--glow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 20px var(--glow)}
.btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.btn.ghost{background:var(--surface-2);color:var(--fg);box-shadow:none;border:1px solid var(--border)}
.btn.ghost svg{stroke:var(--fg)}
.btn.ghost:hover{background:var(--surface-3)}

.stars{color:var(--warn);letter-spacing:2px;font-size:13px}
.stars .off{color:var(--surface-3)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.kv:last-child{border:none}.kv .k{color:var(--muted)}.kv .v{font-weight:700;font-variant-numeric:tabular-nums}

.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.list-row:last-child{border:none}
.dotmark{width:9px;height:9px;border-radius:50%;flex:none}
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border-soft);font-size:12.5px;margin-bottom:10px}
.alert .ab{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.alert .ab svg{width:16px;height:16px;fill:none;stroke-width:1.9}
.alert.crit .ab{background:var(--crit-bg)}.alert.crit .ab svg{stroke:var(--crit)}
.alert.warn .ab{background:var(--warn-bg)}.alert.warn .ab svg{stroke:var(--warn)}
.alert.info .ab{background:rgba(61,130,230,.13)}.alert.info .ab svg{stroke:var(--accent-2)}
.alert b{color:#fff}.alert .at{color:var(--muted)}

/* mini avatar for people */
.pav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  color:#fff;flex:none}
.people{display:flex;align-items:center;gap:9px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,16,.7);backdrop-filter:blur(4px);z-index:60;
  display:none;place-items:center;padding:20px}
.modal-bg.on{display:grid;animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(480px,100%);
  padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h3{font-size:17px;margin-bottom:4px}.modal .sub{color:var(--faint);font-size:12.5px;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;color:var(--fg);font-size:13px;font-family:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--good);
  padding:13px 18px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:.3s;box-shadow:0 14px 40px rgba(0,0,0,.4);display:flex;align-items:center;gap:9px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:17px;height:17px;stroke:var(--good);fill:none;stroke-width:2.2}

svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.scrim{display:none}
@media(max-width:940px){
  #app.on{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .25s;
    box-shadow:0 0 50px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
  .scrim.on{display:block}
  .topbar .burger{display:grid;place-items:center}
  .cols-4,.cols-6,.cols-3{grid-template-columns:repeat(2,1fr)}
  .cols-2,.span-2{grid-template-columns:1fr;grid-column:auto}
  .search{display:none}
}
@media(max-width:560px){
  .content{padding:18px 16px 50px}.topbar{padding:12px 16px}
  .cols-4,.cols-6,.cols-3{grid-template-columns:1fr}
  .crumb h1{font-size:17px}
}
</style>

/* line chart (previsto x realizado) */
function lineChart(series,labels){
  const W=560,H=200,pl=44,pb=26,pt=12,pr=12;
  const all=series.flatMap(s=>s.data);const max=Math.max(...all)*1.1,min=0;
  const x=i=>pl+(i/(labels.length-1))*(W-pl-pr);
  const y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);
    g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#263251" stroke-width="1"/>
        <text x="${pl-8}" y="${yy+4}" text-anchor="end" fill="#6b7793" font-size="10">${(v/1000).toFixed(0)}k</text>`;}
  let lab=labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#6b7793" font-size="10">${l}</text>`).join('');
  let paths=series.map((s,si)=>{
    const d=s.data.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    const dots=s.data.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${s.c}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>${dots}`;
  }).join('');
  const leg=series.map(s=>`<span><i style="background:${s.c};${s.dash?'opacity:.7':''}"></i>${s.name}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${lab}${paths}</svg><div class="legend">${leg}</div>`;
}
/* bar chart */
function barChart(data){
  const W=560,H=200,pl=44,pb=26,pt=12;const max=Math.max(...data.map(d=>d.v))*1.15;
  const bw=(W-pl-12)/data.length;
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=pt+(1-i/4)*(H-pt-pb);
    g+=`<line x1="${pl}" y1="${yy}" x2="${W-12}" y2="${yy}" stroke="#263251"/>
        <text x="${pl-8}" y="${yy+4}" text-anchor="end" fill="#6b7793" font-size="10">${(v/1000).toFixed(0)}k</text>`;}
  let bars=data.map((d,i)=>{const h=(d.v/max)*(H-pt-pb);const xx=pl+i*bw+bw*.2;const w=bw*.6;
    return `<rect x="${xx}" y="${H-pb-h}" width="${w}" height="${h}" rx="4" fill="url(#bg1)"/>
            <text x="${xx+w/2}" y="${H-8}" text-anchor="middle" fill="#6b7793" font-size="10">${d.l}</text>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5ba3f0"/><stop offset="1" stop-color="#2456b8"/></linearGradient></defs>${g}${bars}</svg>`;
}
/* donut */
function donut(segs){
  const total=segs.reduce((a,s)=>a+s.v,0);let a=-90;const R=70,r=44,cx=90,cy=90;
  const arcs=segs.map((s,i)=>{const ang=s.v/total*360;const a2=a+ang;
    const p=polar(cx,cy,R,a),p2=polar(cx,cy,R,a2),q=polar(cx,cy,r,a2),q2=polar(cx,cy,r,a);
    const large=ang>180?1:0;a=a2;
    return `<path d="M${p.x} ${p.y} A${R} ${R} 0 ${large} 1 ${p2.x} ${p2.y} L${q.x} ${q.y} A${r} ${r} 0 ${large} 0 ${q2.x} ${q2.y} Z" fill="${s.c}"/>`;
  }).join('');
  const leg=segs.map(s=>`<span><i style="background:${s.c}"></i>${s.name} · ${s.v}</span>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg width="180" height="180" viewBox="0 0 180 180" style="flex:none">${arcs}
    <text x="90" y="86" text-anchor="middle" fill="#e9eef8" font-size="26" font-weight="700" font-family="Sora">${total}</text>
    <text x="90" y="104" text-anchor="middle" fill="#6b7793" font-size="11">clientes</text></svg>
    <div class="legend" style="flex-direction:column;align-items:flex-start;margin:0">${leg}</div></div>`;
}
function polar(cx,cy,r,ang){const a=ang*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}

/* modal/toast/side */
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').classList.add('on');}
function closeModal(){document.getElementById('modalBg').classList.remove('on');}
let toastT;function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;
  t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800);}
function toggleSide(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('on',open);}
function filterActive(q){q=q.toLowerCase();document.querySelectorAll('#content tbody tr').forEach(tr=>{
  tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none';});}
function enterApp(){document.getElementById('splash').classList.add('hide');document.getElementById('app').classList.add('on');
  setTimeout(()=>document.getElementById('splash').style.display='none',500);}

buildNav();go('dashboard');
